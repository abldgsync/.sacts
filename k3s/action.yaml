name: Sync K3s Binaries
description: 从 k3s-io/k3s GitHub Releases 下载并发布 K3s 二进制到调用方仓库(支持多版本)
inputs:
  binvern:
    description: '指定 K3s 版本号(如 v1.31.0+k3s1 或系列 v1.31,不填则默认同步最新四个稳定版本)'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: S1 解析版本并生成下载清单
      shell: bash
      env:
        WANT: ${{ inputs.binvern }}
        GH_TOKEN: ${{ github.token }}
      run: CS=1 bash "${{ github.action_path }}/dosync.sh"

    - name: S2 并行下载全部二进制包
      shell: bash
      run: CS=2 bash "${{ github.action_path }}/dosync.sh"

    - name: S3 校验 SHA256
      shell: bash
      run: CS=3 bash "${{ github.action_path }}/dosync.sh"

    - name: 按版本循环发布到 Releases
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: CS=4 bash "${{ github.action_path }}/dosync.sh"
