name: Sync Zig Binaries
description: 从 ziglang.org 下载并发布 Zig 二进制到调用方仓库
inputs:
  binvern:
    description: '指定 Zig 版本号(如 0.15.2,不填则使用最新稳定版)'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: 解析版本并生成下载清单
      shell: bash
      env:
        WANT: ${{ inputs.binvern }}
        INDEX_URL: https://ziglang.org/download/index.json
      run: bash "${{ github.action_path }}/scripts/s1_resolve.sh"

    - name: 并行下载全部二进制包
      shell: bash
      run: bash "${{ github.action_path }}/scripts/s2_download.sh"

    - name: 校验 SHA256
      shell: bash
      run: bash "${{ github.action_path }}/scripts/s3_verify.sh"

    - name: 发布到 Releases
      uses: softprops/action-gh-release@v3.0.3
      with:
        files: dist/*
        tag_name: "${{ env.VTAG }}"
        name: "Zig ${{ env.VTAG }} Binaries"
        body: |
          同步自 Zig 官网的二进制程序
          - 版本: ${{ env.ZIGVERSION }}
          - 官网下载地址: ${{ env.BASE }}
          - 同步任务: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        overwrite_files: true
        fail_on_unmatched_files: true
