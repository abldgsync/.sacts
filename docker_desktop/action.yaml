name: Sync Docker Desktop Installers
description: 下载 Docker Desktop 各平台安装包并发布到调用方仓库(按日期打标签)
runs:
  using: composite
  steps:
    - name: S1 生成日期标签
      shell: bash
      run: CS=1 bash "${{ github.action_path }}/dosync.sh"

    - name: S2 下载安装包
      shell: bash
      run: CS=2 bash "${{ github.action_path }}/dosync.sh"

    - name: S3 校验(跳过)
      shell: bash
      run: CS=3 bash "${{ github.action_path }}/dosync.sh"

    - name: 发布到 Releases(按标签循环)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # 本步骤不 checkout,无 .git,gh 无法靠 git 推断仓库;显式指定目标仓库
        GH_REPO: ${{ github.repository }}
      run: CS=4 bash "${{ github.action_path }}/dosync.sh"
