name: Sync Helm Binaries
description: 从 get.helm.sh 下载并发布 Helm 二进制到调用方仓库
inputs:
  binvern:
    description: '指定 Helm 版本号(如 3.19.2 或 v3.19.2,不填则使用最新稳定版)'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: S1 解析版本并生成下载清单
      shell: bash
      env:
        WANT: ${{ inputs.binvern }}
        API: https://api.github.com/repos/helm/helm/releases
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/synchelm.sh" S1

    - name: S2 并行下载全部二进制包
      shell: bash
      run: bash "${{ github.action_path }}/synchelm.sh" S2

    - name: S3 校验 SHA256
      shell: bash
      run: bash "${{ github.action_path }}/synchelm.sh" S3

    - name: 发布到 Releases(按版本循环)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        first=1
        while IFS= read -r VN; do
          [[ -z "$VN" ]] && continue
          echo "=====> 发布版本: $VN"
          if gh release view "$VN" >/dev/null 2>&1; then
            echo "::notice::已存在 release $VN, 先删除再重建"
            gh release delete "$VN" -y
          fi
          if [[ $first -eq 1 ]]; then
            gh release create "$VN" dist/"$VN"/* \
              --title "Helm ${VN} Binaries" \
              --notes "同步自 Helm 官网的二进制程序 (版本: ${VN}, 官网: https://get.helm.sh/)"
            first=0
          else
            gh release create "$VN" dist/"$VN"/* \
              --title "Helm ${VN} Binaries" \
              --notes "同步自 Helm 官网的二进制程序 (版本: ${VN}, 官网: https://get.helm.sh/)" \
              --latest=false
          fi
        done < "${RUNNER_TEMP}/versions.txt"
