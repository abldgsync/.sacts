name: Sync Helm Binaries
description: 从 get.helm.sh 下载并发布 Helm 二进制到调用方仓库
inputs:
  binvern:
    description: '指定 Helm 版本号(如 3.19.2 或 v3.19.2,不填则使用最新稳定版)'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: 解析版本并生成下载清单
      shell: bash
      env:
        WANT: ${{ inputs.binvern }}
        API: https://api.github.com/repos/helm/helm/releases
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
        if [[ -n "${WANT:-}" ]]; then
          tag="v${WANT#v}"
          curl -fsSL --retry 3 --retry-delay 2 "${auth[@]}" "${API}/tags/${tag}" -o rel.json
        else
          curl -fsSL --retry 3 --retry-delay 2 "${auth[@]}" "${API}/latest" -o rel.json
        fi
        VN=$(jq -r '.tag_name' rel.json)
        if [[ "${VN}" =~ -(rc|beta|alpha) ]]; then
          echo "::error::解析到预发布版本 ${VN},请显式指定稳定版本号"
          exit 1
        fi
        jq -r '.assets[].name | select(endswith(".sha256.asc")) | rtrimstr(".sha256.asc")' rel.json | grep -v 'loong' > "${RUNNER_TEMP}/manifest.txt"
        if [[ ! -s "${RUNNER_TEMP}/manifest.txt" ]]; then
          echo "::error::未找到任何可下载资源"
          exit 1
        fi
        echo "VTAG=${VN}" >> "$GITHUB_ENV"
        echo "BASE=https://get.helm.sh/" >> "$GITHUB_ENV"
        echo "解析到版本: ${VN} ($(wc -l < "${RUNNER_TEMP}/manifest.txt") 个资源)"

    - name: 并行下载全部二进制包
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist
        download_one() {
          local name="$1"
          for i in 1 2 3; do
            if curl -4fL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 1200 -o "dist/${name}" "${BASE}${name}"; then
              return 0
            fi
            sleep $((i * 3))
          done
          echo "::error::下载失败: ${name}"
          return 1
        }
        export -f download_one
        xargs -a "${RUNNER_TEMP}/manifest.txt" -I{} -P 8 bash -c 'download_one "$@"' _ {}
        echo "下载完成,文件数: $(find dist -type f | wc -l)"

    - name: 校验 SHA256
      shell: bash
      run: |
        set -euo pipefail
        fail=0
        while read -r name; do
          sum=$(curl -4fsSL --retry 3 "${BASE}${name}.sha256" | awk '{print $1}')
          actual=$(sha256sum "dist/${name}" | awk '{print $1}')
          if [[ "${sum}" != "${actual}" ]]; then
            echo "::error::校验失败: ${name}"
            fail=1
          fi
        done < "${RUNNER_TEMP}/manifest.txt"
        exit ${fail}

    - name: 发布到 Releases
      uses: softprops/action-gh-release@v3.0.3
      with:
        files: dist/*
        tag_name: "${{ env.VTAG }}"
        name: "Helm ${{ env.VTAG }} Binaries"
        body: |
          同步自 Helm 官网的二进制程序
          - 版本: ${{ env.VTAG }}
          - 官网下载地址: ${{ env.BASE }}
        overwrite_files: true
        fail_on_unmatched_files: true
