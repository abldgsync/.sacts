name: Sync Helm Binaries
description: 从 get.helm.sh 下载并发布 Helm 二进制到调用方仓库
inputs:
  binvern:
    description: '指定 Helm 版本号(如 3.19.2 或 v3.19.2,不填则使用最新稳定版)'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: S1 解析版本并生成下载清单
      shell: bash
      env:
        WANT: ${{ inputs.binvern }}
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/synchelm.sh" S1

    - name: S2 并行下载全部二进制包
      shell: bash
      run: bash "${{ github.action_path }}/synchelm.sh" S2

    - name: S3 校验 SHA256
      shell: bash
      run: bash "${{ github.action_path }}/synchelm.sh" S3

    - name: 发布到 Releases(按版本循环)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # 本步骤不 checkout,无 .git,gh 无法靠 git 推断仓库;显式指定目标仓库
        GH_REPO: ${{ github.repository }}
      run: bash "${{ github.action_path }}/synchelm.sh" S4
