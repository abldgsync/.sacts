name: Sync Helm Binaries
description: 从 get.helm.sh 下载并发布 Helm 二进制到调用方仓库
inputs:
  binvern:
    description: '指定 Helm 版本号(如 3.19.2 或 v3.19.2,不填则使用最新稳定版)'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: 解析版本并生成下载清单
      shell: bash
      env:
        WANT: ${{ inputs.binvern }}
        API: https://api.github.com/repos/helm/helm/releases
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/scripts/s1_resolve.sh"

    - name: 并行下载全部二进制包
      shell: bash
      run: bash "${{ github.action_path }}/scripts/s2_download.sh"

    - name: 校验 SHA256
      shell: bash
      run: bash "${{ github.action_path }}/scripts/s3_verify.sh"

    - name: 发布到 Releases
      uses: softprops/action-gh-release@v3.0.3
      with:
        files: dist/*
        tag_name: "${{ env.VTAG }}"
        name: "Helm ${{ env.VTAG }} Binaries"
        body: |
          同步自 Helm 官网的二进制程序
          - 版本: ${{ env.VTAG }}
          - 官网下载地址: ${{ env.BASE }}
        overwrite_files: true
        fail_on_unmatched_files: true
