name: Sync Golang Binaries
description: 从 go.dev 下载并发布 Golang 二进制到调用方仓库
inputs:
  binvern:
    description: '指定 Golang 版本号(如 1.25.0 或 go1.25.0,不填则使用最新稳定版)'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: S1 解析版本并生成下载清单
      shell: bash
      env:
        WANT: ${{ inputs.binvern }}
        BASE_URL: https://go.dev/dl/
      run: bash "${{ github.action_path }}/scripts/sync.sh" S1

    - name: S2 并行下载全部二进制包
      shell: bash
      run: bash "${{ github.action_path }}/scripts/sync.sh" S2

    - name: S3 校验 SHA256
      shell: bash
      run: bash "${{ github.action_path }}/scripts/sync.sh" S3

    - name: 发布到 Releases
      uses: softprops/action-gh-release@v3.0.3
      with:
        files: dist/*
        tag_name: "${{ env.VTAG }}"
        name: "Golang ${{ env.VTAG }} Binaries"
        body: |
          同步自 Golang 官网的二进制程序
          - 版本: ${{ env.GOVERSION }}
          - 官网下载地址: ${{ env.BASE }}
          - 同步任务: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        overwrite_files: true
        fail_on_unmatched_files: true
