name: Sync Golang Binaries
description: 从 go.dev 下载并发布 Golang 二进制到调用方仓库(支持多版本)
inputs:
  binvern:
    description: '指定 Golang 版本号(如 1.25.0 或 go1.25.0,不填则使用最新两个稳定版)'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: S1 解析版本并生成下载清单
      shell: bash
      env:
        WANT: ${{ inputs.binvern }}
        BASE_URL: https://go.dev/dl/
      run: bash "${{ github.action_path }}/syncgolang.sh" s1

    - name: S2 并行下载全部二进制包
      shell: bash
      run: bash "${{ github.action_path }}/syncgolang.sh" s2

    - name: S3 校验 SHA256
      shell: bash
      run: bash "${{ github.action_path }}/syncgolang.sh" s3

    - name: 发布到 Releases(按版本循环)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # 本步骤不 checkout,无 .git,gh 无法靠 git 推断仓库;显式指定目标仓库
        GH_REPO: ${{ github.repository }}
      run: bash "${{ github.action_path }}/syncgolang.sh" s4
