name: Sync Kubectl Binaries
description: 从 dl.k8s.io 下载并发布 Kubectl 二进制到调用方仓库(支持多版本)
inputs:
  binvern:
    description: '指定 Kubectl 版本号(如 v1.33.6 或 1.33.6,不填则使用最新两个稳定版)'
    required: false
    default: ''
  withsvr:
    description: '包含 SERVER 及 NODE 版本(0|1)'
    required: false
    default: '1'
runs:
  using: composite
  steps:
    - name: S1 解析版本并生成下载清单
      shell: bash
      env:
        WANT: ${{ inputs.binvern }}
        WXSV: ${{ inputs.withsvr }}
        API: https://api.github.com/repos/kubernetes/kubernetes/releases
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/synckubectl.sh" s1

    - name: S2 并行下载全部二进制包
      shell: bash
      run: bash "${{ github.action_path }}/synckubectl.sh" s2

    - name: S3 校验 SHA512
      shell: bash
      run: bash "${{ github.action_path }}/synckubectl.sh" s3

    - name: 按版本循环发布到 Releases
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: bash "${{ github.action_path }}/synckubectl.sh" s4
