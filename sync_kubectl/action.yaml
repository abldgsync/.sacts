name: Sync Kubectl Binaries
description: 从 dl.k8s.io 下载并发布 Kubectl 二进制到调用方仓库
inputs:
  binvern:
    description: '指定 Kubectl 版本号(如 v1.33.6 或 1.33.6,不填则使用最新稳定版)'
    required: false
    default: ''
  withsvr:
    description: '包含 SERVER 及 NODE 版本(0|1)'
    required: false
    default: '1'
runs:
  using: composite
  steps:
    - name: 解析版本并生成下载清单
      shell: bash
      env:
        WANT: ${{ inputs.binvern }}
        WXSV: ${{ inputs.withsvr }}
        API: https://api.github.com/repos/kubernetes/kubernetes/releases
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/scripts/s1_resolve.sh"

    - name: 并行下载全部二进制包
      shell: bash
      run: bash "${{ github.action_path }}/scripts/s2_download.sh"

    - name: 校验完整性(SHA512)
      shell: bash
      run: bash "${{ github.action_path }}/scripts/s3_verify.sh"

    - name: 发布到 Releases
      uses: softprops/action-gh-release@v3.0.3
      with:
        files: dist/*
        tag_name: "${{ env.VTAG }}"
        name: "Kubectl ${{ env.VTAG }} Binaries"
        body: |
          手动从 Kubectl 官网同步二进制程序
          - 版本: ${{ env.VTAG }}
          - 官网下载地址: ${{ env.BASE }}/TGZ_FILENAME
        overwrite_files: true
        fail_on_unmatched_files: true
